<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-labelledby="t d">
  <title id="t">BytePath route map</title>
  <desc id="d">A transit-style map of IT and computer science. The blue line runs from IT support through Networking to Linux. A coral line branches up from Networking to Security and Cloud. A green line branches from Linux to Python and SQL. A violet line along the top runs through the computer science tracks: Programming, Math, Algorithms, Architecture and Operating systems.</desc>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8FAEFF" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="520" height="400" fill="#141D33"/>
  <rect width="520" height="400" fill="url(#g)"/>

  <!-- IT lines -->
  <path d="M50 340 H150 L210 280 H300" fill="none" stroke="#4B74FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150 340 V200 L210 140 H300" fill="none" stroke="#E8553D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 280 H400 L450 230 V190" fill="none" stroke="#17A47C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- computer science line -->
  <path d="M60 60 H360 L410 110 H470" fill="none" stroke="#8B63F5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- start markers -->
  <circle cx="50" cy="340" r="24" fill="#FFC736"/>
  <circle cx="60" cy="60" r="24" fill="#FFC736"/>

  <!-- stations -->
  <g fill="#141D33" stroke="#E8EEFA" stroke-width="4">
    <circle cx="50" cy="340" r="11"/>
    <circle cx="150" cy="340" r="14"/>
    <circle cx="300" cy="280" r="14"/>
    <circle cx="400" cy="280" r="11"/>
    <circle cx="450" cy="190" r="11"/>
    <circle cx="150" cy="200" r="11"/>
    <circle cx="300" cy="140" r="11"/>
    <circle cx="60" cy="60" r="11"/>
    <circle cx="160" cy="60" r="11"/>
    <circle cx="260" cy="60" r="11"/>
    <circle cx="360" cy="60" r="11"/>
    <circle cx="470" cy="110" r="11"/>
  </g>

  <!-- labels -->
  <g font-family="Figtree, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#E8EEFA">
    <text x="50" y="384" text-anchor="middle">IT support</text>
    <text x="50" y="298" text-anchor="middle" font-size="13" fill="#FFC736">Start here</text>
    <text x="150" y="384" text-anchor="middle">Networking</text>
    <text x="300" y="318" text-anchor="middle">Linux</text>
    <text x="400" y="318" text-anchor="middle">Python</text>
    <text x="450" y="166" text-anchor="middle">SQL</text>
    <text x="132" y="205" text-anchor="end">Security</text>
    <text x="300" y="116" text-anchor="middle">Cloud</text>

    <text x="60" y="108" text-anchor="middle" font-size="13" fill="#FFC736">Start here</text>
    <text x="60" y="30" text-anchor="middle" font-size="15">Programming</text>
    <text x="160" y="36" text-anchor="middle" font-size="15">Math</text>
    <text x="260" y="36" text-anchor="middle" font-size="15">Algorithms</text>
    <text x="360" y="36" text-anchor="middle" font-size="15">Architecture</text>
    <text x="470" y="88" text-anchor="middle" font-size="15">Op. systems</text>

    <text x="505" y="384" text-anchor="end" font-size="13" font-weight="600" fill="#C4AEFF">Violet line = computer science</text>
  </g>
</svg>
